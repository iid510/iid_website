<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Ijebu Igbo Descendants in Diaspora</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(135deg, #0b2a6b, #06184a);
        color: #f7f3e8;
        font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card { max-width: 420px; }
      .crown { font-size: 46px; line-height: 1; margin-bottom: 18px; }
      h1 { font-size: 26px; margin: 0 0 12px; font-weight: 800; letter-spacing: -0.02em; }
      p { margin: 0 0 26px; line-height: 1.65; color: rgba(247, 243, 232, 0.72); font-size: 15px; }
      button {
        background: #bf9a2d;
        color: #1a1a1a;
        border: 0;
        font: inherit;
        font-weight: 700;
        padding: 14px 30px;
        border-radius: 12px;
        cursor: pointer;
        min-height: 48px;
      }
      button:active { transform: scale(0.98); }
      .note { margin-top: 22px; font-size: 12px; color: rgba(247, 243, 232, 0.45); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="crown">👑</div>
      <h1>You're offline</h1>
      <p>
        We couldn't reach the network. Pages you've already visited are still available —
        try again once you have a signal.
      </p>
      <button onclick="location.reload()">Try again</button>
      <p class="note">Ijebu Igbo Descendants in Diaspora</p>
    </div>
  </body>
</html>
